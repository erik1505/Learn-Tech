spring.application.name=learn-tech-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:sqlite:./data/learntech.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# O Hibernate cria/atualiza o esquema do SQLite a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Configure MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD e MAIL_FROM no servidor.
# Para provedores autenticados, defina também MAIL_SMTP_AUTH=true e MAIL_SMTP_STARTTLS=true.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:false}
app.mail.from=${MAIL_FROM:no-reply@learntech.local}

# Envia a mensagem dos erros (ex: "E-mail já cadastrado") para o front-end
server.error.include-message=always

# Credenciais personalizadas do Spring Security
spring.security.user.name=admin
spring.security.user.password=123456