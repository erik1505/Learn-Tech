spring.application.name=learn-tech-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:sqlite:./data/learntech.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# O Hibernate cria/atualiza o esquema do SQLite a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Envia a mensagem dos erros (ex: "E-mail já cadastrado") para o front-end
server.error.include-message=always

# Credenciais personalizadas do Spring Security
spring.security.user.name=admin
spring.security.user.password=123456