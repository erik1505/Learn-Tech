spring.application.name=learn-tech-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/Learn_tech?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O banco e o LearnTech.sql: o Hibernate so confere, nao cria/altera nada.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# Envia a mensagem dos erros (ex: "E-mail já cadastrado") para o front-end
server.error.include-message=always

# Credenciais personalizadas do Spring Security
spring.security.user.name=admin
spring.security.user.password=123456