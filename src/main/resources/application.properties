spring.application.name=learn-tech-backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:sqlite:./data/learntech.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# O Hibernate cria/atualiza o esquema do SQLite a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.jackson.serialization.write-dates-as-timestamps=false

# O padrão usa Gmail SMTP; configure credenciais via ambiente para enviar mensagens.
# Veja EMAIL-SETUP.md para instruções de execução no IntelliJ e Docker.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@learntech.local}}

# SMS Gateway para Android em modo Local Server.
app.sms-gateway.url=${SMS_GATEWAY_URL:}
app.sms-gateway.username=${SMS_GATEWAY_USERNAME:}
app.sms-gateway.password=${SMS_GATEWAY_PASSWORD:}

# Envia a mensagem dos erros (ex: "E-mail já cadastrado") para o front-end
server.error.include-message=always

# Credenciais personalizadas do Spring Security
spring.security.user.name=admin
spring.security.user.password=123456