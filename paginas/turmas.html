      <!-- TELA 1: LISTAGEM DE TURMAS -->
      <main id="screen-turmas">
        <h1 class="page-title">TUR<span class="accent-blue">MAS</span></h1>
        <div class="actions-row-prof" data-somente="PROFESSOR">
          <button type="button" class="btn-round-action" onclick="novaTurma()">NOVA TURMA</button>
        </div>
        <div class="turmas-row" id="turmas-lista"></div>
      </main>

      <!-- TELA 2: EDIÇÃO/CRIAÇÃO DE TURMAS -->
      <main id="screen-edicao" class="hidden">
        <h1 class="page-title">EDIÇÃO <span class="accent-blue">DE TURMAS</span></h1>
        <form class="edit-form-container" onsubmit="event.preventDefault(); salvarTurma();">
          <div class="form-group">
            <label for="nome-turma">NOME DA TURMA (SALA)</label>
            <input type="text" id="nome-turma" class="form-input" placeholder="Digite o nome da sala..." required>
          </div>
          <div class="form-group">
            <label for="qtd-turma">QUANTIDADE DE ALUNOS</label>
            <input type="number" id="qtd-turma" class="form-input" min="0" placeholder="Ex: 30" required>
          </div>
          <div class="form-group">
            <label for="link-grupo">LINK DO GRUPO</label>
            <input type="url" id="link-grupo" class="form-input" placeholder="https://..." required>
          </div>
          <div class="form-buttons-row">
            <button type="submit" class="btn-round-action">SALVAR EDIÇÃO</button>
            <button type="button" class="btn-round-action" onclick="showScreen('turmas')">DESCARTAR EDIÇÃO</button>
          </div>
        </form>
      </main>
